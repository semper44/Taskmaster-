apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taskmaster-ingress
  namespace: taskmaster
spec:
  ingressClassName: nginx
  rules:
    - host: taskmaster.local
      http:
        paths:
          # Backend API routes
          - path: /tasks
            pathType: Prefix
            backend:
              service:
                name: taskmaster-backend
                port:
                  number: 8000
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: taskmaster-backend
                port:
                  number: 8000
          # Frontend static website (default fallback)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: taskmaster-frontend
                port:
                  number: 80
