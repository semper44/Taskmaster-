apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskmaster-backend
  labels:
    app: taskmaster-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskmaster-backend
  template:
    metadata:
      labels:
        app: taskmaster-backend
    spec:
      containers:
        - name: taskmaster-backend
          image: taskmaster-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: taskmaster-secrets
                  key: DJANGO_SECRET_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: taskmaster-secrets
                  key: DATABASE_URL
            - name: CLOUD_NAME
              valueFrom:
                secretKeyRef:
                  name: taskmaster-secrets
                  key: CLOUD_NAME
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: taskmaster-secrets
                  key: API_KEY
            - name: API_SECRET
              valueFrom:
                secretKeyRef:
                  name: taskmaster-secrets
                  key: API_SECRET
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: taskmaster-secrets
                  key: GEMINI_API_KEY
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
