apiVersion: v1
kind: Secret
metadata:
  name: taskmaster-backend-secrets
  namespace: taskmaster
  labels:
    app: taskmaster-backend
type: Opaque
stringData:
  DJANGO_SECRET_KEY: "change-this-secret-key"
