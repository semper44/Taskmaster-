  CLOUD_NAME: ""
  API_KEY: ""
  API_SECRET: ""
  GEMINI_API_KEY: ""
  POSTGRES_DB: "taskmaster"
  POSTGRES_USER: "taskmaster"
  POSTGRES_PASSWORD: "taskmasterpass"
