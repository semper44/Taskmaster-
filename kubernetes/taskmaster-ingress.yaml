apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taskmaster-ingress
  namespace: taskmaster
spec:
  ingressClassName: nginx
  rules:
    - host: taskmaster.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: taskmaster-backend
                port:
                  number: 8000
